name: Tester et publier le frontend live

on:
  push:
    branches: [dev, live]
  pull_request:
    branches: [dev, live]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests et build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Installer les dependances
        run: npm ci
      - name: Verifier le code
        run: |
          npm run type-check
          npm test -- --runInBand
      - name: Construire le paquet live
        if: github.ref == 'refs/heads/live' && github.event_name != 'pull_request'
        env:
          VITE_API_URL: https://api.septentrional.tg/api/v2
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$VITE_API_KEY"
          npm run build
          tar -C dist -czf "$RUNNER_TEMP/release.tar.gz" .
          cp scripts/deploy/server.sh "$RUNNER_TEMP/server.sh"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/live' && github.event_name != 'pull_request'
        with:
          name: frontend-live-release
          path: |
            ${{ runner.temp }}/release.tar.gz
            ${{ runner.temp }}/server.sh
          retention-days: 7

  publish:
    name: Publier le paquet valide
    needs: test
    if: github.ref == 'refs/heads/live' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-live-release
          path: release
      - uses: actions/checkout@v4
        with:
          ref: live
          path: source
      - name: Publier la branche technique live-build
        run: |
          set -euo pipefail
          cd source
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 0
          git switch --orphan live-build
          cp ../release/release.tar.gz ../release/server.sh .
          printf '%s\n' "$GITHUB_SHA" > revision
          sha256sum release.tar.gz > SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release.tar.gz server.sh revision SHA256SUMS
          git commit -m "Tested frontend live release $GITHUB_SHA"
          git push --force origin HEAD:live-build
