name: Déployer le frontend live

on:
  push:
    branches: [live]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: septentrional-frontend-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Construire et déployer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: live
      url: https://front.septentrional.tg
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_BASE_PATH: ${{ vars.DEPLOY_BASE_PATH }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.septentrional.tg/api/v2' }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
        run: |
          test -n "$VITE_API_KEY" || {
            echo "Le secret VITE_API_KEY est absent de l'environnement GitHub live."
            exit 1
          }
          npm run build

      - name: Vérifier la configuration de déploiement
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || exit 1
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$DEPLOY_BASE_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1

      - name: Configurer la clé SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || exit 1
          test -n "$DEPLOY_SSH_KNOWN_HOSTS" || exit 1
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Préparer la release distante
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$DEPLOY_BASE_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          base="$1"
          release="$base/releases/$2"
          mkdir -p "$release"
          REMOTE

      - name: Envoyer les fichiers construits
        run: |
          rsync -az --delete \
            -e "ssh -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes" \
            dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE_PATH/releases/$GITHUB_SHA/"

      - name: Activer la release
        id: release
        run: |
          previous="$({
            ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
              "$DEPLOY_BASE_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          base="$1"
          release="$base/releases/$2"
          test -f "$release/index.html"
          previous=""
          if [[ -L "$base/current" ]]; then
            previous="$(readlink -f "$base/current")"
          fi
          ln -sfn "$release" "$base/current.next"
          mv -Tf "$base/current.next" "$base/current"
          printf '%s' "$previous"
          REMOTE
          } 2>/dev/null)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Vérifier le site
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            https://front.septentrional.tg/

      - name: Restaurer la release précédente en cas d'échec
        if: ${{ failure() && steps.release.outputs.previous != '' }}
        env:
          PREVIOUS_RELEASE: ${{ steps.release.outputs.previous }}
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$DEPLOY_BASE_PATH" "$PREVIOUS_RELEASE" <<'REMOTE'
          set -Eeuo pipefail
          base="$1"
          previous="$2"
          case "$previous" in
            "$base"/releases/*) ;;
            *) exit 1 ;;
          esac
          test -f "$previous/index.html"
          ln -sfn "$previous" "$base/current.next"
          mv -Tf "$base/current.next" "$base/current"
          REMOTE
