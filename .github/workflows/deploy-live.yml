name: Vérifier le frontend live

on:
  push:
    branches: [live]
  pull_request:
    branches: [live]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript et build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier TypeScript
        run: npm run type-check

      - name: Vérifier le build de production
        env:
          VITE_API_URL: https://api.septentrional.tg/api/v2
          VITE_API_KEY: ci-validation-key
        run: npm run build
